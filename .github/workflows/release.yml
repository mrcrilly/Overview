name: Build and release macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build universal app and disk image
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="v0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          bash scripts/build-release.sh "$version"

      - name: Save DMG
        uses: actions/upload-artifact@v7
        with:
          name: Overview-macOS
          path: .build/release/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Overview-macOS
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd release
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # A retry replaces assets without changing existing release notes.
            gh release upload "$RELEASE_TAG" ./*.dmg --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" ./*.dmg \
              --verify-tag --title "Overview $RELEASE_TAG" --generate-notes \
              --notes 'Universal macOS build (Apple Silicon and Intel). The app is ad-hoc signed and is not Apple-notarized. Open the .dmg, then drag Overview.app to Applications. Use Help → View Releases for future updates; updates are installed manually.' \
              "${flags[@]}"
          fi
